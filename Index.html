<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>HoopStat</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#edf3fa;background:#0b1220}*{box-sizing:border-box}body{margin:0;padding-bottom:90px}header{position:sticky;top:0;background:#111b2deb;backdrop-filter:blur(15px);padding:16px 18px;z-index:5;border-bottom:1px solid #29364b}h1{font-size:23px;margin:0}h2{font-size:19px;margin:8px 0 15px}.muted,small{color:#9baac0}main{max-width:850px;margin:auto;padding:18px}.card{background:#172338;border:1px solid #2a3a53;border-radius:16px;padding:16px;margin-bottom:12px}.line{display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.score{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums}.tag{background:#2b3d59;border-radius:7px;padding:4px 8px;font-size:12px}button,.btn{background:#ef742c;border:0;border-radius:10px;color:white;padding:11px 14px;font-weight:700;cursor:pointer;font-size:14px}button.secondary{background:#293c58}button.danger{background:#8d3541}button:disabled{opacity:.45}input,select{background:#0c1728;color:white;border:1px solid #3a4b66;border-radius:10px;padding:12px;width:100%;font-size:16px}label{display:block;font-size:13px;color:#bdc9d9;margin:12px 0 6px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{text-align:center;padding:14px 5px}.stat b{font-size:25px;display:block}.nav{position:fixed;bottom:0;left:0;right:0;background:#111b2d;border-top:1px solid #34445c;display:flex;justify-content:space-around;padding:9px 0 max(12px,env(safe-area-inset-bottom));z-index:9}.nav button{background:none;color:#aebbd0;font-size:11px;padding:6px 3px;min-width:55px}.nav button.active{color:#ff944d}.nav span{display:block;font-size:21px;margin-bottom:3px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:9px;border-bottom:1px solid #304057;text-align:center}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#172338}th{color:#a7b7ca} .pill{color:#ffa66c}.hidden{display:none}.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.qgrid input{text-align:center;padding:9px 2px} .notice{font-size:12px;color:#c0cde0;line-height:1.5} @media(max-width:380px){.score{font-size:23px}.card{padding:12px}}
</style></head><body><header><div class="line"><h1>🏀 HoopStat</h1><span class="tag">OFFLINE FIRST</span></div></header><main id="app"></main><nav class="nav" id="nav"></nav><script>
const KEY='hoopstat_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}db=db&&Array.isArray(db.teams)&&Array.isArray(db.players)&&Array.isArray(db.games)?db:{teams:[],players:[],games:[]};let tab='home',selectedGame=null;const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()},team=id=>db.teams.find(t=>t.id===id),player=id=>db.players.find(p=>p.id===id),name=id=>team(id)?.name||'Unknown',num=v=>Math.max(0,Number(v)||0),sum=a=>a.reduce((x,y)=>x+num(y),0),stats=['MIN','FGM','FGA','3PM','3PA','FTM','FTA','OREB','DREB','AST','STL','BLK','TO','PF'];function pts(s){return 2*num(s.FGM)+num(s['3PM'])+num(s.FTM)}function reb(s){return num(s.OREB)+num(s.DREB)}function total(g,side){return sum(g[side+'Q'])}function record(id){let w=0,l=0,pf=0,pa=0;db.games.filter(g=>g.status==='Final'&&(g.home===id||g.away===id)).forEach(g=>{let a=total(g,'home'),b=total(g,'away'),mine=g.home===id?a:b,other=g.home===id?b:a;pf+=mine;pa+=other;if(mine>other)w++;else if(mine<other)l++});return {w,l,pf,pa,d:pf-pa}}
function options(items,value='',title='Select'){return `<option value="">${title}</option>`+items.map(t=>`<option value="${esc(t.id)}" ${t.id===value?'selected':''}>${esc(t.name)}</option>`).join('')}
function nav(){let tabs=[['home','⌂','Home'],['teams','♜','Teams'],['players','♟','Players'],['games','▦','Games'],['export','⇩','Export']];$('nav').innerHTML=tabs.map(([id,ico,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')"><span>${ico}</span>${label}</button>`).join('')}
function go(t){tab=t;selectedGame=null;render()}function render(){nav();let html='';if(tab==='home'){let finals=db.games.filter(g=>g.status==='Final');html=`<h2>Dashboard</h2><div class="grid3"><div class="card stat"><b>${db.teams.length}</b><small>Teams</small></div><div class="card stat"><b>${db.players.length}</b><small>Players</small></div><div class="card stat"><b>${db.games.length}</b><small>Games</small></div></div><h2>Recent matches</h2>${[...db.games].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(gameCard).join('')||'<div class="card muted">Create teams and your first match to get started.</div>'}<h2>Standings</h2>${standings()}`}
if(tab==='teams')html=`<h2>Teams</h2><form class="card" onsubmit="addTeam(event)"><label>Team name</label><input id="tname" required placeholder="e.g. Brisbane Royals"><div class="grid"><div><label>Abbreviation</label><input id="tabbr" maxlength="5" placeholder="BRR"></div><div><label>City / region</label><input id="tcity" placeholder="Brisbane"></div></div><div class="actions"><button>Add team</button></div></form>${db.teams.map(t=>`<div class="card"><div class="line"><div><b>${esc(t.name)}</b> <span class="tag">${esc(t.abbr)}</span><div class="muted">${esc(t.city||'')} · ${db.players.filter(p=>p.team===t.id).length} players</div></div><button class="secondary" onclick="editTeam('${t.id}')">Edit</button></div></div>`).join('')}`;
if(tab==='players')html=`<h2>Players</h2><form class="card" onsubmit="addPlayer(event)"><label>Full name</label><input id="pname" required placeholder="Player name"><div class="grid"><div><label>Team</label><select id="pteam" required>${options(db.teams)}</select></div><div><label>Jersey #</label><input id="pnumber" type="number" min="0" max="99" placeholder="23"></div><div><label>Position</label><select id="ppos">${['PG','SG','SF','PF','C'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Age (optional)</label><input id="page" type="number" min="1" max="99"></div></div><div class="actions"><button ${!db.teams.length?'disabled':''}>Add player</button></div></form>${db.players.map(p=>`<div class="card line"><div><b>#${esc(p.number||'—')} ${esc(p.name)}</b><div class="muted">${esc(name(p.team))} · ${esc(p.pos)} ${p.age?'· Age '+esc(p.age):''}</div></div><button class="secondary" onclick="editPlayer('${p.id}')">Edit</button></div>`).join('')}`;
if(tab==='games')html=selectedGame?gameDetail(selectedGame):`<h2>Matches</h2><form class="card" onsubmit="addGame(event)"><div class="grid"><div><label>Away team</label><select id="gaway" required>${options(db.teams)}</select></div><div><label>Home team</label><select id="ghome" required>${options(db.teams)}</select></div></div><label>Date</label><input id="gdate" type="date" value="${new Date().toLocaleDateString('en-CA')}" required><label>Venue (optional)</label><input id="gvenue" placeholder="Court / stadium"><div class="actions"><button ${db.teams.length<2?'disabled':''}>Create match</button></div></form>${[...db.games].sort((a,b)=>b.date.localeCompare(a.date)).map(gameCard).join('')}`;
if(tab==='export')html=`<h2>Export & backup</h2><div class="card"><p class="notice">Export records to CSV for Excel or Numbers, or download a complete JSON backup that can be restored later.</p><div class="actions"><button onclick="exportCSV('teams')">Teams CSV</button><button onclick="exportCSV('players')">Players CSV</button><button onclick="exportCSV('games')">Matches CSV</button><button onclick="exportCSV('box')">Box scores CSV</button><button onclick="backup()">Full JSON backup</button></div></div><div class="card"><h2>Restore backup</h2><input type="file" id="restore" accept=".json,application/json" onchange="restoreData(event)"><p class="notice">Restoring replaces all existing data. Export a backup first.</p></div><div class="card"><h2>Install on iPhone</h2><p class="notice">Open the hosted app in Safari, tap Share → Add to Home Screen. After the first online load, the app works offline. Device storage may be cleared by iOS; keep backups.</p></div>`;
$('app').innerHTML=html}
function standings(){return `<div class="card tablewrap"><table><thead><tr><th>Team</th><th>W</th><th>L</th><th>PF</th><th>PA</th><th>+/-</th></tr></thead><tbody>${db.teams.map(t=>({t,r:record(t.id)})).sort((a,b)=>b.r.w-a.r.w||b.r.d-a.r.d).map(({t,r})=>`<tr><td>${esc(t.name)}</td><td>${r.w}</td><td>${r.l}</td><td>${r.pf}</td><td>${r.pa}</td><td>${r.d}</td></tr>`).join('')}</tbody></table></div>`}
function gameCard(g){return `<div class="card" onclick="openGame('${g.id}')" style="cursor:pointer"><div class="line"><small>${esc(g.date)} · ${esc(g.status)}</small><span class="pill">View →</span></div><div class="line" style="margin-top:10px"><div>${esc(name(g.away))}<div class="muted">AWAY</div></div><span class="score">${total(g,'away')} – ${total(g,'home')}</span><div style="text-align:right">${esc(name(g.home))}<div class="muted">HOME</div></div></div></div>`}
function addTeam(e){e.preventDefault();let n=$('tname').value.trim();db.teams.push({id:uid(),name:n,abbr:$('tabbr').value.trim().toUpperCase()||n.slice(0,3).toUpperCase(),city:$('tcity').value.trim()});save()}
function addPlayer(e){e.preventDefault();db.players.push({id:uid(),name:$('pname').value.trim(),team:$('pteam').value,number:$('pnumber').value,pos:$('ppos').value,age:$('page').value});save()}
function addGame(e){e.preventDefault();let home=$('ghome').value,away=$('gaway').value;if(home===away)return alert('Choose two different teams');db.games.push({id:uid(),home,away,date:$('gdate').value,venue:$('gvenue').value,status:'Scheduled',homeQ:[0,0,0,0],awayQ:[0,0,0,0],box:{}});save()}
function editTeam(id){let t=team(id),n=prompt('Team name',t.name);if(n===null)return;if(!n.trim())return alert('Name required');t.name=n.trim();let a=prompt('Abbreviation',t.abbr);if(a!==null)t.abbr=a.trim().toUpperCase().slice(0,5);save()}
function editPlayer(id){let p=player(id),n=prompt('Player name',p.name);if(n===null)return;if(!n.trim())return alert('Name required');p.name=n.trim();let j=prompt('Jersey number',p.number);if(j!==null)p.number=j;save()}
function openGame(id){tab='games';selectedGame=id;render()}
function gameDetail(id){let g=db.games.find(x=>x.id===id);if(!g)return '';let qcount=Math.max(4,g.homeQ.length,g.awayQ.length);let cols=Array.from({length:qcount},(_,i)=>`<th>${i<4?'Q'+(i+1):'OT'+(i-3)}</th>`).join('');let row=side=>`<tr><td>${esc(name(g[side]))}</td>${Array.from({length:qcount},(_,i)=>`<td><input aria-label="${side} period ${i+1}" type="number" min="0" max="999" value="${g[side+'Q'][i]||0}" onchange="setQuarter('${id}','${side}',${i},this.value)" style="width:58px;padding:8px 2px"></td>`).join('')}<td><b>${total(g,side)}</b></td></tr>`;return `<div class="line"><button class="secondary" onclick="selectedGame=null;render()">← Matches</button><span class="tag">${esc(g.status)}</span></div><h2>${esc(name(g.away))} @ ${esc(name(g.home))}</h2><p class="muted">${esc(g.date)} · ${esc(g.venue||'Venue not set')}</p><div class="card"><div class="line"><div>${esc(name(g.away))}</div><span class="score">${total(g,'away')} – ${total(g,'home')}</span><div>${esc(name(g.home))}</div></div></div><div class="card"><h2>Quarter scores</h2><div class="tablewrap"><table><thead><tr><th>Team</th>${cols}<th>Total</th></tr></thead><tbody>${row('away')}${row('home')}</tbody></table></div><div class="actions"><button class="secondary" onclick="addOT('${id}')">+ Overtime</button><button onclick="setStatus('${id}','${g.status==='Final'?'In Progress':'Final'}')">${g.status==='Final'?'Reopen':'Mark final'}</button></div></div><h2>Player box score</h2><p class="notice">Enter made and attempted shots. PTS and REB calculate automatically. Player points should reconcile with team quarter totals.</p>${['away','home'].map(side=>boxTable(g,side)).join('')}<div class="actions"><button class="danger" onclick="deleteGame('${id}')">Delete match</button></div>`}
function boxTable(g,side){let ps=db.players.filter(p=>p.team===g[side]);let keys=['MIN','FGM','FGA','3PM','3PA','FTM','FTA','OREB','DREB','AST','STL','BLK','TO','PF'];return `<div class="card"><h2>${esc(name(g[side]))}</h2>${!ps.length?'<p class="muted">Add players to this team to record box scores.</p>':''}<div class="tablewrap"><table><thead><tr><th>Player</th><th>PTS</th><th>REB</th>${keys.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${ps.map(p=>{let s=g.box[p.id]||{};return `<tr><td>#${esc(p.number)} ${esc(p.name)}</td><td><b>${pts(s)}</b></td><td><b>${reb(s)}</b></td>${keys.map(k=>`<td><input aria-label="${esc(p.name)} ${k}" type="number" min="0" max="999" value="${num(s[k])}" style="width:54px;padding:7px 3px" onchange="setStat('${g.id}','${p.id}','${k}',this.value)"></td>`).join('')}</tr>`}).join('')}</tbody></table></div></div>`}
function setQuarter(id,side,i,v){let g=db.games.find(x=>x.id===id);g[side+'Q'][i]=Math.floor(num(v));if(g.status==='Scheduled')g.status='In Progress';save()}function addOT(id){let g=db.games.find(x=>x.id===id);g.homeQ.push(0);g.awayQ.push(0);save()}function setStatus(id,s){let g=db.games.find(x=>x.id===id);if(s==='Final'&&total(g,'home')===total(g,'away'))return alert('A final game cannot end in a tie. Add overtime or adjust scores.');g.status=s;save()}function setStat(id,pid,k,v){let g=db.games.find(x=>x.id===id);g.box[pid]??={};g.box[pid][k]=Math.floor(num(v));save()}function deleteGame(id){if(confirm('Delete this match and its box scores?')){db.games=db.games.filter(g=>g.id!==id);selectedGame=null;save()}}
function csv(rows){if(!rows.length)return '';let keys=Object.keys(rows[0]);return [keys,...rows.map(r=>keys.map(k=>r[k]??''))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n')}function download(filename,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}function exportCSV(kind){let rows=[];if(kind==='teams')rows=db.teams.map(t=>({...t,...record(t.id)}));if(kind==='players')rows=db.players.map(p=>({...p,teamName:name(p.team)}));if(kind==='games')rows=db.games.map(g=>({id:g.id,date:g.date,venue:g.venue,status:g.status,away:name(g.away),home:name(g.home),awayPeriods:g.awayQ.join('-'),homePeriods:g.homeQ.join('-'),awayTotal:total(g,'away'),homeTotal:total(g,'home')}));if(kind==='box')rows=db.games.flatMap(g=>Object.entries(g.box).map(([id,s])=>({gameId:g.id,date:g.date,player:player(id)?.name||id,team:name(player(id)?.team),PTS:pts(s),REB:reb(s),...Object.fromEntries(stats.map(k=>[k,num(s[k])]))})));if(!rows.length)return alert('No records to export');download('hoopstat-'+kind+'.csv','\ufeff'+csv(rows),'text/csv;charset=utf-8')}
function backup(){download('hoopstat-backup.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),...db},null,2),'application/json')}
async function restoreData(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.teams)||!Array.isArray(d.players)||!Array.isArray(d.games))throw Error('Invalid backup');if(!confirm('Replace all current data with this backup?'))return;db={teams:d.teams,players:d.players,games:d.games};save();alert('Backup restored')}catch(err){alert('Could not restore: '+err.message)}}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
